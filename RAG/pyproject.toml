[project]
name = "ai-banking-rag"
version = "0.1.0"
description = "Traceable read-only Chinese RAG prototype for AI Banking"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
banking-rag = "banking_rag.cli:main"

[tool.setuptools.packages.find]
include = ["banking_rag*"]
