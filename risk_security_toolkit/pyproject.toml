[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "github-risk-scaffold"
version = "0.1.0"
description = "Traceable GitHub documentation ingestion and conservative risk/security scaffolding"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
risk-scaffold = "risk_scaffold.cli:main"

[tool.setuptools.packages.find]
include = ["risk_scaffold*"]
